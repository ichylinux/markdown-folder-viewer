<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Folder Viewer</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand">Markdown Folder Viewer</div><div class="toolbar"><button type="button" id="choose">Choose folder</button><button type="button" id="refresh" disabled>Refresh</button><input id="search" type="search" placeholder="Filter files…" aria-label="Filter files"></div></header><main class="layout"><aside class="sidebar"><div id="saved" class="saved" hidden></div><div class="sidebar-head"><strong id="folderName">No folder selected</strong><span id="fileCount"></span></div><nav id="tree" aria-label="Markdown files"><p class="muted">Choose a folder to start.</p></nav></aside><section class="reader"><div id="welcome" class="welcome"><h1>Read Markdown from a local folder</h1><p>Choose a folder. Markdown files in that folder appear in the tree; expand a folder to load its contents.</p><button type="button" id="choose2">Choose folder</button><p class="muted">The folder stays on your device. Access may need to be re-authorized by Chrome later.</p></div><div id="error" class="welcome" role="alert" hidden></div><article id="document" class="markdown-body" hidden></article></section></main><script src="markdown.js"></script><script src="handles.js"></script><script src="render.js"></script><script src="viewer.js"></script></body></html>
